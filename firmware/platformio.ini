; =============================================================
; Claw Machine ESP32 Firmware — PlatformIO Configuration
; =============================================================
; Target: ESP32 DevKit / Wemos D1 R32
; Framework: Arduino
; =============================================================

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_protocol = espota
upload_port = 192.168.178.136

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    -DARDUINO_LOOP_STACK_SIZE=8192
    -std=gnu++17

build_unflags =
    -std=gnu++11

; Libraries
lib_deps =
    fastled/FastLED @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.0.0
    madhephaestus/ESP32Servo @ ^3.0.0
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git

; Partition scheme — use larger app partition for OTA
board_build.partitions = min_spiffs.csv

; File system
board_build.filesystem = spiffs

; Native test environment (runs on host for unit tests)
[env:native]
platform = native
build_flags =
    -std=c++17
    -DUNIT_TEST
    -DNATIVE_BUILD
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
